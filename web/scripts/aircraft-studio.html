<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StormCheck aircraft studio</title>
    <style>
      body {
        margin: 0;
        background: #080e17;
        color: #dfe8f2;
        font: 14px system-ui;
      }
      nav {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
        z-index: 1;
      }
      button {
        background: #18283a;
        color: inherit;
        border: 1px solid #42607b;
        padding: 10px 16px;
        border-radius: 7px;
        cursor: pointer;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #sketch {
        position: fixed;
        inset: 70px 20px 45px;
        background: #153454;
      }
      #sketch svg {
        width: 100%;
        height: 100%;
      }
      #sketch path {
        fill: none;
        stroke: #e8f0fa;
        stroke-width: 0.035;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      output {
        position: fixed;
        bottom: 18px;
        left: 20px;
        color: #adc0d4;
      }
    </style>
  </head>
  <body>
    <nav>
      <button data-view="poster">Poster</button
      ><button data-view="side">Side</button
      ><button data-view="nose">Cockpit</button
      ><button data-view="engine">Engine</button
      ><button data-sketch="side">Side sketch</button
      ><button data-sketch="top">Top sketch</button
      ><button id="save">Save story assets</button>
    </nav>
    <aside id="sketch" hidden></aside>
    <output>Loading aircraft…</output>
    <script type="module" src="./aircraft-studio.mjs"></script>
  </body>
</html>
