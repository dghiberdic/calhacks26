[project]
name = "stormcheck"
version = "0.1.0"
description = "StormCheck — autonomous EU261 disruption-liability seats for an airline (Cal Hacks 13.0, Hyphenate track)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.9",
  "httpx>=0.27",
  "orjson>=3.10",
  "anthropic>=0.70",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "airportsdata>=20240101",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.100",
  "respx>=0.21",
  "time-machine>=2.14",
  "pytest-watcher>=0.4",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["contracts", "engine", "server", "scripts", "world", "llm", "books", "eval"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
